
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clinicaflow"
version = "0.1.0"
description = "Sistema financeiro e emissor de NFS-e para uma clínica"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
    "lxml",
    "httpx",
    "python-dotenv",
    "signxml",
    "cryptography",
    "email-validator",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clinicaflow = ["web/*.html"]
